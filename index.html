<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Certificate Verifier | Decentralized Blockchain Credential Platform</title>
    <meta name="description" content="Secure, tamper-proof academic certificate issuance and instant verification powered by Ethereum Smart Contracts." />
    <meta name="author" content="Vishal Barai" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Open Graph Metadata -->
    <meta property="og:title" content="Certificate Verifier | Blockchain Academic Credentials" />
    <meta property="og:description" content="Decentralized verification platform ensuring 100% authentic, tamper-proof academic credentials." />
    <meta property="og:type" content="website" />

    <!-- Anti-FOUC Theme Script -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('certificate-verifier-theme') || localStorage.getItem('theme');
          const isDark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>

  <body class="bg-background text-foreground antialiased selection:bg-primary/20 selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
